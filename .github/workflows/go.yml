name: go

on:
  push:
    branches: [ "main", "gui" ]
  pull_request:
    branches: [ "main", "gui" ]

jobs:

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: make web-deps
      - name: typecheck
        run: make web-check
      - name: build
        run: make web

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: console
        run: make web-deps web
      - name: build
        run: go build -v ./...

  build-without-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: the embed placeholder is tracked
        run: git ls-files --error-unmatch internal/api/ui/dist/.gitkeep
      - name: build
        run: go build -v ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: console
        run: make web-deps web
      # The container suites live in e2e.yml: they need a docker socket, which
      # not every runner has.
      - name: unit tests
        run: make unit-test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1
