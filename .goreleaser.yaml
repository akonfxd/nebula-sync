version: 2

# Releases go to Gitea, not GitHub. Without this goreleaser reads the ssh
# remote, cannot tell what is behind it, and defaults to api.github.com.
gitea_urls:
  api: https://gitea.buhnet.org/api/v1
  download: https://gitea.buhnet.org

# Gitea Actions injects GITHUB_TOKEN as well as GITEA_TOKEN, and goreleaser
# refuses to guess which one a run meant.
force_token: gitea

# Every binary embeds the console, so it has to be built before the first
# target is compiled. Hooks run once, from the project root.
before:
  hooks:
    - npm --prefix web ci
    - npm --prefix web run build

builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -X github.com/lovelaze/nebula-sync/version.Version={{ .Tag }}
    goos:
      - linux
      - windows
      - darwin

    goarch:
      - 386
      - amd64
      - arm
      - arm64

    goarm:
      - 6
      - 7

    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm

archives:
  - formats: ['tar.gz']
    format_overrides:
      - goos: windows
        formats: ['zip']

checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^typo:"
